# REAL DATA - Experiment 1 (+4): baseline comparison on the GenImage subset (8 generators), 2 seeds.
experiment_id: real_exp1_genimage
description: ResNet-50 vs EfficientNet-B0 on GenImage subset (identical splits), seed 42 (time-limited run)
comparison_type: comparison
baseline: ResNet-50
seeds: [42]
variants:
  - {label: ResNet-50, key: resnet50, train_config: ml/configs/train/genimage_sub_resnet50.yaml}
  - {label: EfficientNet-B0, key: efficientnet_b0, train_config: ml/configs/train/genimage_sub_efficientnet_b0.yaml}
evaluations:
  - name: test
    dataset: {splits: [test]}
  - name: robustness
    dataset: {splits: [test]}
    perturbations:
      - {type: clean}
      - {type: jpeg, quality: 90}
      - {type: jpeg, quality: 70}
      - {type: jpeg, quality: 50}
      - {type: downscale, factor: 0.5}
      - {type: downscale, factor: 0.25}
      - {type: blur, sigma: 1.0}
      - {type: blur, sigma: 2.0}
      - {type: noise, std: 5.0}
      - {type: noise, std: 15.0}
