# Experiment 4 — Robustness. Same checkpoint and threshold; perturbations applied at test time.
experiment_id: exp4_robustness
description: Clean vs JPEG(90/70/50), downscale(0.5/0.25), blur(1/2), noise(5/15)
seeds: [42]
variants:
  - {label: ResNet-50, key: resnet50, train_config: ml/configs/train/aigen_resnet50.yaml}
  - {label: EfficientNet-B0, key: efficientnet_b0, train_config: ml/configs/train/aigen_efficientnet_b0.yaml}
evaluations:
  - name: robustness
    dataset: {splits: [test], max_per_class: 2000}
    perturbations:
      - {type: clean}
      - {type: jpeg, quality: 90}
      - {type: jpeg, quality: 70}
      - {type: jpeg, quality: 50}
      - {type: downscale, factor: 0.5}
      - {type: downscale, factor: 0.25}
      - {type: blur, sigma: 1.0}
      - {type: blur, sigma: 2.0}
      - {type: noise, std: 5.0}
      - {type: noise, std: 15.0}
