# REAL DATA - Experiment 1 (+4): baseline comparison on DeepFakeFace.
experiment_id: real_exp1_dff
description: ResNet-50 vs EfficientNet-B0 on DeepFakeFace v2 (dedup-merged id groups) + shortcut control (size/JPEG-equalised preprocessing)
comparison_type: comparison
baseline: ResNet-50
seeds: [42]
variants:
  - {label: ResNet-50, key: resnet50, train_config: ml/configs/train/dff_resnet50.yaml}
  - {label: EfficientNet-B0, key: efficientnet_b0, train_config: ml/configs/train/dff_efficientnet_b0.yaml}
  - label: EfficientNet-B0 + size/JPEG-equalised
    key: efficientnet_b0_norm
    train_config: ml/configs/train/dff_efficientnet_b0.yaml
    overrides: ["preprocess.normalize_short_side=256", "preprocess.normalize_jpeg_quality=90"]
evaluations:
  - name: test
    dataset: {splits: [test], max_per_class: 4500}
  - name: robustness
    dataset: {splits: [test], max_per_class: 1500}
    perturbations:
      - {type: clean}
      - {type: jpeg, quality: 90}
      - {type: jpeg, quality: 70}
      - {type: jpeg, quality: 50}
      - {type: downscale, factor: 0.5}
      - {type: downscale, factor: 0.25}
      - {type: blur, sigma: 1.0}
      - {type: blur, sigma: 2.0}
      - {type: noise, std: 5.0}
      - {type: noise, std: 15.0}
